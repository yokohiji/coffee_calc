<style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Zen+Maru+Gothic:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --wood-1:#3a2b1f;
  --wood-2:#4a3626;
  --board:#20281f;
  --board-line:#3a4a37;
  --chalk:#eee7d8;
  --chalk-dim:#a9b7a0;
  --kraft:#d8c7a3;
  --kraft-2:#e6d8b8;
  --ink:#3c2a1a;
  --ink-soft:#6b543e;
  --hot:#c1611f;
  --hot-dim:rgba(193,97,31,0.28);
  --ice:#2f8fae;
  --ice-dim:rgba(47,143,174,0.28);
  --warn:#a8391c;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;overflow-x:hidden;width:100%;}
body{
  background:
    repeating-linear-gradient(115deg, rgba(0,0,0,0.05) 0px, rgba(0,0,0,0.05) 2px, transparent 2px, transparent 26px),
    linear-gradient(160deg, var(--wood-1), var(--wood-2) 60%, var(--wood-1));
  color:var(--chalk);
  font-family:'Zen Maru Gothic', sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:36px 16px;
}

.app{ width:100%; max-width:940px; min-width:0; }

.masthead{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  margin-bottom:24px;
  flex-wrap:wrap;
  gap:10px;
  min-width:0;
}
.masthead .title-wrap{ display:flex; align-items:center; gap:10px; min-width:0; }
.masthead h1{
  font-family:'Caveat', cursive;
  font-weight:700;
  font-size:clamp(38px,5.5vw,54px);
  letter-spacing:0.01em;
  margin:0;
  color:var(--chalk);
  transform:rotate(-2deg);
  display:inline-block;
  white-space:nowrap;
}
.bean-icon{ width:26px; height:26px; flex-shrink:0; transform:rotate(-15deg); }
.masthead .sub{
  font-family:'Zen Maru Gothic', sans-serif;
  font-weight:500;
  color:var(--chalk-dim);
  font-size:12.5px;
  letter-spacing:0.04em;
  background:rgba(255,255,255,0.06);
  padding:5px 12px;
  border-radius:999px;
  border:1px dashed rgba(238,231,216,0.35);
  min-width:0;
  max-width:100%;
}

.mode-toggle{
  display:flex;
  background:rgba(0,0,0,0.25);
  border:1px solid rgba(238,231,216,0.25);
  border-radius:999px;
  padding:4px;
  width:fit-content;
  margin-bottom:22px;
}
.mode-toggle button{
  border:none;
  background:transparent;
  color:var(--chalk-dim);
  font-family:'Zen Maru Gothic', sans-serif;
  font-weight:700;
  font-size:13px;
  letter-spacing:0.05em;
  padding:9px 24px;
  border-radius:999px;
  cursor:pointer;
  transition:all .25s ease;
}
.mode-toggle button.active{
  background:var(--accent);
  color:#1c140c;
}

.board{
  display:grid;
  grid-template-columns:1.1fr 0.9fr;
  gap:22px;
  min-width:0;
}
@media (max-width:720px){ .board{ grid-template-columns:1fr; } }

/* ---- chalkboard card (inputs) ---- */
.card.chalk{
  background:
    radial-gradient(ellipse at 20% 10%, rgba(255,255,255,0.03), transparent 60%),
    var(--board);
  border:10px solid #4a3626;
  border-radius:6px;
  box-shadow:0 10px 26px rgba(0,0,0,0.35), inset 0 0 40px rgba(0,0,0,0.35);
  padding:26px 24px;
  position:relative;
  min-width:0;
}
.card.chalk::before{
  content:"MENU";
  position:absolute;
  top:-13px; left:20px;
  background:#4a3626;
  color:var(--kraft-2);
  font-family:'Caveat', cursive;
  font-weight:700;
  font-size:15px;
  padding:0 10px;
  letter-spacing:0.06em;
}

.field{ margin-bottom:22px; }
.field:last-child{ margin-bottom:0; }
.field-label{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  margin-bottom:9px;
}
.field-label span.name{
  font-size:13px;
  color:var(--chalk-dim);
  letter-spacing:0.02em;
  font-weight:500;
}
.field-label span.val{
  font-family:'IBM Plex Mono', monospace;
  font-size:20px;
  font-weight:600;
  color:var(--chalk);
}
.field-label span.val .unit{
  font-size:12px;
  color:var(--chalk-dim);
  font-weight:400;
  margin-left:2px;
}
input[type=range]{
  -webkit-appearance:none;
  width:100%;
  height:2px;
  background:repeating-linear-gradient(90deg, rgba(238,231,216,0.4) 0 6px, transparent 6px 10px);
  border-radius:2px;
  outline:none;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:17px;height:17px;
  border-radius:50%;
  background:var(--accent);
  cursor:pointer;
  border:3px solid var(--board);
  box-shadow:0 0 0 1px var(--accent);
}
input[type=range]::-moz-range-thumb{
  width:17px;height:17px;
  border-radius:50%;
  background:var(--accent);
  cursor:pointer;
  border:3px solid var(--board);
}

.advanced-toggle{
  margin-top:20px;
  font-size:12.5px;
  color:var(--chalk-dim);
  cursor:pointer;
  font-family:'Zen Maru Gothic', sans-serif;
  font-weight:500;
  letter-spacing:0.02em;
  user-select:none;
}
.advanced-toggle:hover{ color:var(--chalk); }
.advanced-panel{
  display:none;
  margin-top:12px;
  padding-top:14px;
  border-top:1px dashed rgba(238,231,216,0.3);
}
.advanced-panel.open{ display:block; }

.fav-section{
  margin-top:22px;
  padding-top:16px;
  border-top:1px dashed rgba(238,231,216,0.3);
}
.fav-title{
  font-family:'Caveat', cursive;
  font-weight:700;
  font-size:19px;
  color:var(--chalk);
  margin-bottom:10px;
  transform:rotate(-1deg);
}
.fav-add{
  display:flex;
  gap:8px;
  margin-bottom:12px;
}
.fav-input{
  flex:1;
  min-width:0;
  background:rgba(255,255,255,0.06);
  border:1px dashed rgba(238,231,216,0.35);
  border-radius:6px;
  color:var(--chalk);
  font-family:'Zen Maru Gothic', sans-serif;
  font-size:12.5px;
  padding:8px 10px;
  outline:none;
}
.fav-input::placeholder{ color:rgba(169,183,160,0.6); }
.fav-input:focus{ border-color:var(--accent); }
.fav-save-btn{
  border:1px solid var(--accent);
  background:transparent;
  color:var(--accent);
  font-family:'Zen Maru Gothic', sans-serif;
  font-weight:700;
  font-size:12.5px;
  padding:0 16px;
  border-radius:6px;
  cursor:pointer;
  transition:all .2s ease;
  flex-shrink:0;
}
.fav-save-btn:hover{ background:var(--accent); color:#1c140c; }
.fav-save-btn:disabled{ opacity:0.4; cursor:default; background:transparent; color:var(--accent); }

.fav-list{ display:flex; flex-direction:column; gap:6px; }
.fav-empty{
  font-size:12px;
  color:rgba(169,183,160,0.6);
  font-style:italic;
}
.fav-storage-note{
  font-size:10px;
  color:rgba(169,183,160,0.5);
  margin-top:8px;
  font-family:'IBM Plex Mono', monospace;
}
.fav-item{
  display:flex;
  align-items:center;
  gap:8px;
  background:rgba(255,255,255,0.05);
  border:1px dashed rgba(238,231,216,0.25);
  border-radius:8px;
  padding:8px 10px;
}
.fav-item .fav-load{
  flex:1;
  background:none;
  border:none;
  color:var(--chalk);
  text-align:left;
  cursor:pointer;
  font-family:'Zen Maru Gothic', sans-serif;
  font-size:12.5px;
  padding:0;
  min-width:0;
}
.fav-item .fav-load .fname{ font-weight:700; display:block; }
.fav-item .fav-load .fmeta{
  font-family:'IBM Plex Mono', monospace;
  font-size:10.5px;
  color:var(--chalk-dim);
}
.fav-item .fav-badge{
  font-size:10px;
  font-family:'IBM Plex Mono', monospace;
  padding:2px 6px;
  border-radius:999px;
  border:1px solid currentColor;
  flex-shrink:0;
}
.fav-item .fav-badge.hot{ color:#e08a4f; }
.fav-item .fav-badge.ice{ color:#7fc4de; }
.fav-item .fav-del{
  background:none;
  border:none;
  color:rgba(238,231,216,0.4);
  cursor:pointer;
  font-size:15px;
  line-height:1;
  padding:2px 4px;
  flex-shrink:0;
}
.fav-item .fav-del:hover{ color:var(--warn); }

/* ---- kraft ticket card (results) ---- */
.card.ticket{
  background:
    repeating-linear-gradient(0deg, rgba(0,0,0,0.025) 0 1px, transparent 1px 3px),
    var(--kraft);
  color:var(--ink);
  border-radius:2px;
  padding:24px 22px 18px;
  position:relative;
  box-shadow:0 12px 28px rgba(0,0,0,0.4), 0 2px 0 rgba(255,255,255,0.15) inset;
  transform:rotate(0.6deg);
  min-width:0;
}
.card.ticket::after{
  content:"";
  position:absolute;
  left:0; right:0; bottom:-9px;
  height:16px;
  background-image: radial-gradient(circle at 10px 0, transparent 8px, var(--kraft) 8.5px);
  background-size: 20px 16px;
  background-repeat: repeat-x;
  filter:drop-shadow(0 6px 6px rgba(0,0,0,0.3));
}
.stamp{
  position:absolute;
  top:14px; right:16px;
  width:64px; height:64px;
  border:2px solid var(--hot);
  border-radius:50%;
  color:var(--hot);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-family:'Caveat', cursive;
  font-weight:700;
  font-size:12px;
  line-height:1.15;
  transform:rotate(12deg);
  opacity:0.75;
}
.stamp.ice{ border-color:var(--ice); color:var(--ice); }

.readout-title{
  font-family:'Zen Maru Gothic', sans-serif;
  font-weight:700;
  font-size:13px;
  letter-spacing:0.06em;
  color:var(--ink-soft);
  margin-bottom:14px;
  padding-bottom:10px;
  border-bottom:1px dashed rgba(60,42,26,0.3);
}

.result-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.result-item{
  background:rgba(255,255,255,0.35);
  border:1px dashed rgba(60,42,26,0.25);
  border-radius:8px;
  padding:12px 14px;
  min-width:0;
  overflow:hidden;
}
.result-item.wide{ grid-column:1 / -1; }
.result-item .rlabel{ font-size:11.5px; color:var(--ink-soft); font-weight:500; }
.result-item .rval{
  font-family:'IBM Plex Mono', monospace;
  font-size:24px;
  font-weight:600;
  margin-top:2px;
  color:var(--ink);
}
.result-item .rval .u{ font-size:12.5px; color:var(--ink-soft); font-weight:400; margin-left:3px; }
.result-item.hero{
  background:linear-gradient(135deg, var(--accent-dim), rgba(255,255,255,0.4));
  border:1.5px solid var(--accent);
}
.result-item.hero .rval{ font-size:30px; color:var(--ink); }

.warn-box{
  margin-top:12px;
  font-size:12px;
  color:#fff;
  background:var(--warn);
  border-radius:6px;
  padding:9px 12px;
  display:none;
  font-weight:500;
}

/* ---- carafe + steam ---- */
.carafe-wrap{
  display:flex;
  flex-direction:column;
  align-items:center;
  padding-top:14px;
}
.steam-svg{ width:60px; height:34px; margin-bottom:-6px; }
.steam-svg path{
  fill:none;
  stroke:rgba(60,42,26,0.35);
  stroke-width:2.5;
  stroke-linecap:round;
  stroke-dasharray:24;
  stroke-dashoffset:24;
  animation:steamRise 3.2s ease-in-out infinite;
}
.steam-svg path:nth-child(2){ animation-delay:.7s; }
.steam-svg path:nth-child(3){ animation-delay:1.4s; }
@keyframes steamRise{
  0%{ stroke-dashoffset:24; opacity:0; transform:translateY(4px); }
  25%{ opacity:.9; }
  75%{ opacity:.4; }
  100%{ stroke-dashoffset:0; opacity:0; transform:translateY(-8px); }
}
@media (prefers-reduced-motion: reduce){
  .steam-svg path{ animation:none; opacity:.5; stroke-dashoffset:0; }
}
.carafe-svg{ width:140px; height:200px; }
.legend{
  display:flex;
  gap:16px;
  margin-top:10px;
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  color:var(--ink-soft);
  flex-wrap:wrap;
  justify-content:center;
}
.legend .dot{
  display:inline-block;
  width:8px;height:8px;
  border-radius:50%;
  margin-right:5px;
}

footer{
  margin-top:22px;
  font-size:11.5px;
  color:var(--chalk-dim);
  line-height:1.8;
  font-family:'IBM Plex Mono', monospace;
  text-align:center;
}

@media (max-width:480px){
  body{ padding:20px 14px; }
  .masthead{ margin-bottom:16px; }
  .masthead h1{ font-size:34px; transform:rotate(-1deg); }
  .masthead .sub{ font-size:11px; padding:4px 10px; }
  .mode-toggle{ margin-bottom:16px; }
  .mode-toggle button{ padding:8px 20px; font-size:12px; }
  .card.chalk, .card.ticket{ padding:18px 16px; }
  .field{ margin-bottom:16px; }
  .field-label span.val{ font-size:17px; }
  .readout-title{ font-size:12px; margin-bottom:10px; padding-bottom:8px; }
  .result-item{ padding:10px 12px; }
  .result-item .rval{ font-size:20px; }
  .result-item.hero .rval{ font-size:25px; }
  .card.ticket{ transform:rotate(0.2deg); }
  .stamp{ width:48px; height:48px; font-size:10px; top:10px; right:10px; }
  .carafe-svg{ width:112px; height:160px; }
  .steam-svg{ width:48px; height:28px; }
  footer{ font-size:10.5px; margin-top:16px; }
  .fav-title{ font-size:17px; }
}
</style>
</head>
<body>

<div class="app">
  <div class="masthead">
    <div class="title-wrap">
      <svg class="bean-icon" viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 6.9 2 12.5S6.5 22 12 22s10-4.4 10-9.5S17.5 2 12 2z" fill="#c1611f"/><path d="M12 3.5C8.5 6 8.5 9 12 11s3.5 5 0 9.5" stroke="#2a1a10" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg>
      <h1>Drip Calc</h1>
    </div>
    <div class="sub">豆量 × 比率 × 出来上がり量</div>
  </div>

  <div class="mode-toggle">
    <button id="btnHot" class="active">HOT</button>
    <button id="btnIce">ICE</button>
  </div>

  <div class="board">
    <div class="card chalk">
      <div class="field">
        <div class="field-label">
          <span class="name">豆の量</span>
          <span class="val"><span id="beanVal">30.0</span><span class="unit">g</span></span>
        </div>
        <input type="range" id="beanSlider" min="10" max="60" step="0.5" value="30">
      </div>

      <div class="field">
        <div class="field-label">
          <span class="name">比率(湯量 ÷ 豆量)</span>
          <span class="val">1:<span id="ratioVal">15.3</span></span>
        </div>
        <input type="range" id="ratioSlider" min="6" max="20" step="0.1" value="15.3">
      </div>

      <div class="field" id="targetField">
        <div class="field-label">
          <span class="name">出来上がり量(目標)</span>
          <span class="val"><span id="targetVal">400</span><span class="unit">ml</span></span>
        </div>
        <input type="range" id="targetSlider" min="100" max="800" step="10" value="400">
      </div>

      <div class="advanced-toggle" id="advToggle">▸ 詳細設定(豆の吸水率)</div>
      <div class="advanced-panel" id="advPanel">
        <div class="field" style="margin-bottom:0;">
          <div class="field-label">
            <span class="name">吸水率(豆1gが吸う湯量)</span>
            <span class="val"><span id="absVal">2.0</span><span class="unit">ml/g</span></span>
          </div>
          <input type="range" id="absSlider" min="0.5" max="4" step="0.1" value="2.0">
        </div>
      </div>

      <div class="fav-section">
        <div class="fav-title">☆ お気に入りの配合</div>
        <div class="fav-add">
          <input type="text" id="favName" class="fav-input" placeholder="なまえ(例: 3人分ホット)" maxlength="20">
          <button id="favSaveBtn" class="fav-save-btn">保存</button>
        </div>
        <div class="fav-list" id="favList"></div>
        <div class="fav-empty" id="favEmpty">まだ保存されていません</div>
        <div class="fav-storage-note" id="favStorageNote"></div>
      </div>
    </div>

    <div class="card ticket">
      <div class="stamp" id="stampBox">本日の<br>一杯</div>
      <div class="readout-title" id="readoutTitle">算出結果 — HOT</div>
      <div class="result-grid" id="resultGrid"></div>
      <div class="warn-box" id="warnBox"></div>

      <div class="carafe-wrap">
        <svg class="steam-svg" viewBox="0 0 60 34">
          <path d="M18 30 Q24 20 18 12 Q12 5 18 2"/>
          <path d="M30 30 Q36 20 30 12 Q24 5 30 2"/>
          <path d="M42 30 Q48 20 42 12 Q36 5 42 2"/>
        </svg>
        <svg class="carafe-svg" viewBox="0 0 150 220">
          <defs>
            <clipPath id="carafeClip">
              <path d="M40 20 L110 20 L100 70 L112 190 Q112 205 96 205 L54 205 Q38 205 38 190 L50 70 Z" />
            </clipPath>
          </defs>
          <path d="M40 20 L110 20 L100 70 L112 190 Q112 205 96 205 L54 205 Q38 205 38 190 L50 70 Z"
                fill="none" stroke="#3c2a1a" stroke-width="2.5"/>
          <g clip-path="url(#carafeClip)">
            <rect id="liquidFill" x="30" y="205" width="90" height="0" fill="#8a4a1f"/>
            <g id="iceGroup"></g>
          </g>
          <line x1="112" y1="190" x2="132" y2="185" stroke="#3c2a1a" stroke-width="2.5"/>
          <path d="M50 68 L100 68" stroke="#3c2a1a" stroke-width="1.5" stroke-dasharray="2 3"/>
        </svg>
        <div class="legend" id="legendBox"></div>
      </div>
    </div>
  </div>

  <footer>
    式 — HOT: 湯量 = 豆量×比率 / 出来上がり量 = 湯量 − 豆量×吸水率<br>
    式 — ICE: 湯量 = 豆量×比率 / 氷量 = 出来上がり量 − 湯量 + 豆量×吸水率(氷は完全に溶ける前提)
  </footer>
</div>

<script>
let mode = 'hot';
let lastEdited = 'ratio'; // 'ratio' or 'target' -- for hot mode two-way solve

const beanSlider = document.getElementById('beanSlider');
const ratioSlider = document.getElementById('ratioSlider');
const targetSlider = document.getElementById('targetSlider');
const absSlider = document.getElementById('absSlider');

const beanVal = document.getElementById('beanVal');
const ratioVal = document.getElementById('ratioVal');
const targetVal = document.getElementById('targetVal');
const absVal = document.getElementById('absVal');

const btnHot = document.getElementById('btnHot');
const btnIce = document.getElementById('btnIce');
const readoutTitle = document.getElementById('readoutTitle');
const resultGrid = document.getElementById('resultGrid');
const warnBox = document.getElementById('warnBox');
const legendBox = document.getElementById('legendBox');
const liquidFill = document.getElementById('liquidFill');
const iceGroup = document.getElementById('iceGroup');
const advToggle = document.getElementById('advToggle');
const advPanel = document.getElementById('advPanel');
const stampBox = document.getElementById('stampBox');
const favName = document.getElementById('favName');
const favSaveBtn = document.getElementById('favSaveBtn');
const favList = document.getElementById('favList');
const favEmpty = document.getElementById('favEmpty');

let favorites = [];

const hasArtifactStorage = (typeof window !== 'undefined' && !!window.storage);
const LS_KEY = 'drip-calc-favorites';

async function storageGet(){
  if(hasArtifactStorage){
    const res = await window.storage.get('favorites', false);
    return res && res.value ? res.value : null;
  } else {
    return window.localStorage.getItem(LS_KEY);
  }
}
async function storageSet(value){
  if(hasArtifactStorage){
    await window.storage.set('favorites', value, false);
  } else {
    window.localStorage.setItem(LS_KEY, value);
  }
}

async function loadFavorites(){
  try{
    const raw = await storageGet();
    favorites = raw ? JSON.parse(raw) : [];
  }catch(e){
    favorites = [];
  }
  renderFavorites();
}

async function persistFavorites(){
  try{
    await storageSet(JSON.stringify(favorites));
  }catch(e){
    console.error('保存に失敗しました', e);
  }
}

function renderFavorites(){
  favEmpty.style.display = favorites.length ? 'none' : 'block';
  favList.innerHTML = favorites.map(f => `
    <div class="fav-item">
      <button class="fav-load" data-id="${f.id}">
        <span class="fname">${f.name}</span>
        <span class="fmeta">豆${fmt(f.bean,1)}g ・ 1:${fmt(f.ratio,1)} ・ ${fmt(f.target,0)}ml</span>
      </button>
      <span class="fav-badge ${f.mode}">${f.mode==='hot'?'HOT':'ICE'}</span>
      <button class="fav-del" data-id="${f.id}" title="削除">×</button>
    </div>
  `).join('');

  favList.querySelectorAll('.fav-load').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const f = favorites.find(x => x.id === btn.dataset.id);
      if(!f) return;
      setMode(f.mode);
      beanSlider.value = f.bean;
      ratioSlider.value = f.ratio;
      targetSlider.value = f.target;
      lastEdited = 'ratio';
      calc();
    });
  });
  favList.querySelectorAll('.fav-del').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      favorites = favorites.filter(x => x.id !== btn.dataset.id);
      renderFavorites();
      await persistFavorites();
    });
  });
}

favSaveBtn.addEventListener('click', async ()=>{
  const bean = parseFloat(beanSlider.value);
  const ratio = parseFloat(ratioSlider.value);
  const target = parseFloat(targetSlider.value);
  const name = favName.value.trim() || (mode==='hot' ? 'ホット' : 'アイス') + ` 豆${fmt(bean,0)}g`;
  favorites.unshift({
    id: Date.now().toString(36),
    name, mode, bean, ratio, target
  });
  favorites = favorites.slice(0, 12);
  favName.value = '';
  renderFavorites();
  await persistFavorites();
});

function setMode(m){
  mode = m;
  document.documentElement.style.setProperty('--accent', m==='hot' ? '#c1611f' : '#2f8fae');
  document.documentElement.style.setProperty('--accent-dim', m==='hot' ? 'rgba(193,97,31,0.28)' : 'rgba(47,143,174,0.28)');
  btnHot.classList.toggle('active', m==='hot');
  btnIce.classList.toggle('active', m==='ice');
  stampBox.classList.toggle('ice', m==='ice');
  stampBox.innerHTML = m==='hot' ? '本日の<br>一杯' : 'ICED<br>今日';
  if(m==='hot' && parseFloat(ratioSlider.value) < 12){ ratioSlider.value = 15.3; }
  if(m==='ice' && parseFloat(ratioSlider.value) > 12){ ratioSlider.value = 8.7; }
  readoutTitle.textContent = '算出結果 — ' + (m==='hot' ? 'HOT' : 'ICE');
  calc();
}
btnHot.addEventListener('click', ()=>setMode('hot'));
btnIce.addEventListener('click', ()=>setMode('ice'));

advToggle.addEventListener('click', ()=>{
  advPanel.classList.toggle('open');
  advToggle.textContent = (advPanel.classList.contains('open') ? '▾' : '▸') + ' 詳細設定(豆の吸水率)';
});

ratioSlider.addEventListener('input', ()=>{ lastEdited='ratio'; calc(); });
targetSlider.addEventListener('input', ()=>{ lastEdited='target'; calc(); });
beanSlider.addEventListener('input', calc);
absSlider.addEventListener('input', calc);

function fmt(n, d=1){
  return Number(n).toLocaleString('ja-JP',{minimumFractionDigits:d, maximumFractionDigits:d});
}

function calc(){
  const bean = parseFloat(beanSlider.value);
  const a = parseFloat(absSlider.value);
  let ratio = parseFloat(ratioSlider.value);
  let target = parseFloat(targetSlider.value);

  beanVal.textContent = fmt(bean,1);
  absVal.textContent = fmt(a,1);

  if(mode==='hot'){
    if(lastEdited==='ratio'){
      target = bean*ratio - bean*a;
      target = Math.max(target,0);
      targetSlider.value = Math.min(Math.max(target,parseFloat(targetSlider.min)),parseFloat(targetSlider.max));
    } else {
      ratio = (target + bean*a)/bean;
      ratio = Math.min(Math.max(ratio,parseFloat(ratioSlider.min)),parseFloat(ratioSlider.max));
      ratioSlider.value = ratio;
    }
    ratioVal.textContent = fmt(ratio,1);
    targetVal.textContent = fmt(target,0);

    const water = bean*ratio;
    const output = water - bean*a;

    resultGrid.innerHTML = `
      <div class="result-item"><div class="rlabel">注ぐ湯量</div><div class="rval">${fmt(water,0)}<span class="u">ml</span></div></div>
      <div class="result-item"><div class="rlabel">豆への吸水</div><div class="rval">${fmt(bean*a,0)}<span class="u">ml</span></div></div>
      <div class="result-item wide hero"><div class="rlabel">出来上がり量</div><div class="rval">${fmt(output,0)}<span class="u">ml</span></div></div>
    `;
    warnBox.style.display='none';

    legendBox.innerHTML = `<span><span class="dot" style="background:#8a4a1f"></span>コーヒー ${fmt(output,0)}ml</span>`;
    const maxScale = 500;
    const pct = Math.min(output/maxScale, 1);
    liquidFill.setAttribute('y', 205 - 185*pct);
    liquidFill.setAttribute('height', 185*pct);
    liquidFill.setAttribute('fill', '#8a4a1f');
    iceGroup.innerHTML = '';

  } else {
    ratioVal.textContent = fmt(ratio,1);
    targetVal.textContent = fmt(target,0);

    const water = bean*ratio;
    const ice = target - water + bean*a;

    resultGrid.innerHTML = `
      <div class="result-item"><div class="rlabel">注ぐ湯量(濃縮)</div><div class="rval">${fmt(water,0)}<span class="u">ml</span></div></div>
      <div class="result-item"><div class="rlabel">豆への吸水</div><div class="rval">${fmt(bean*a,0)}<span class="u">ml</span></div></div>
      <div class="result-item wide hero"><div class="rlabel">氷の量(先にサーバーへ)</div><div class="rval">${fmt(Math.max(ice,0),0)}<span class="u">g</span></div></div>
    `;

    if(ice < 0){
      warnBox.style.display='block';
      warnBox.textContent = '氷の量がマイナスになっています。比率を下げるか、出来上がり量を増やしてください。';
    } else {
      warnBox.style.display='none';
    }

    legendBox.innerHTML = `
      <span><span class="dot" style="background:#8a4a1f"></span>湯 ${fmt(water,0)}ml</span>
      <span><span class="dot" style="background:#bfe6f2"></span>氷 ${fmt(Math.max(ice,0),0)}g</span>
    `;

    const maxScale = 500;
    const totalPct = Math.min(Math.max(target,0)/maxScale, 1);
    liquidFill.setAttribute('y', 205 - 185*totalPct);
    liquidFill.setAttribute('height', 185*totalPct);
    liquidFill.setAttribute('fill', '#6f7f8a');

    iceGroup.innerHTML = '';
    const iceFrac = target>0 ? Math.max(ice,0)/target : 0;
    const cubeCount = Math.round(iceFrac*10);
    const baseY = 205 - 185*totalPct;
    for(let i=0;i<cubeCount;i++){
      const cx = 55 + (i%4)*14;
      const cy = baseY + 8 + Math.floor(i/4)*13;
      const r = document.createElementNS('http://www.w3.org/2000/svg','rect');
      r.setAttribute('x', cx);
      r.setAttribute('y', cy);
      r.setAttribute('width', 10);
      r.setAttribute('height', 10);
      r.setAttribute('rx', 2);
      r.setAttribute('fill', '#d9f0f7');
      r.setAttribute('opacity', 0.85);
      iceGroup.appendChild(r);
    }
  }
}

setMode('hot');
loadFavorites();
document.getElementById('favStorageNote').textContent =
  hasArtifactStorage ? '保存先: Claude' : '保存先: このブラウザ(localStorage)';
</script>
</body>
</html>
